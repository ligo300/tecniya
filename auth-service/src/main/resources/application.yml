server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:tecniya}
    password: ${DB_PASSWORD:tecniya123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres}
    expiration-minutes: 120
  admin:
    email: ${ADMIN_EMAIL:admin@tecniya.pe}
    password: ${ADMIN_PASSWORD:Admin12345}
