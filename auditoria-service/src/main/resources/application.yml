server:
  port: 8086

spring:
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:tecniya}
    password: ${RABBIT_PASSWORD:tecniya123}
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  application:
    name: auditoria-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/auditoria_db}
    username: ${DB_USER:tecniya}
    password: ${DB_PASSWORD:tecniya123}
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres}
