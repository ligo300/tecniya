server:
  port: 8084

spring:
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:tecniya}
    password: ${RABBIT_PASSWORD:tecniya123}
    connection-timeout: 3s
  application:
    name: ordenes-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/ordenes_db}
    username: ${DB_USER:tecniya}
    password: ${DB_PASSWORD:tecniya123}
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres}
  tecnicos:
    url: ${TECNICOS_URL:http://tecnicos-service}
  internal:
    key: ${INTERNAL_KEY:clave-interna-de-desarrollo}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  eventos:
    habilitado: ${EVENTOS_HABILITADOS:true}
