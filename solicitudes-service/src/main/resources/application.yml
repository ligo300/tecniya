server:
  port: 8083

spring:
  application:
    name: solicitudes-service
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/solicitudes_db}
    username: ${DB_USER:tecniya}
    password: ${DB_PASSWORD:tecniya123}
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres}
  tecnicos:
    url: ${TECNICOS_URL:http://tecnicos-service}
